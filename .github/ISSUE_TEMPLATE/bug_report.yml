name: Bug report
description: Report a reproducible defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or exploitable vulnerability details. Follow SECURITY.md for security reports."
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
