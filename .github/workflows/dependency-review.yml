name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dependency-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
