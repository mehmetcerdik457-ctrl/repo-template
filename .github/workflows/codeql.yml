name: CodeQL

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
