name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: mehmetcerdik457-ctrl/.github/.github/workflows/reusable-scorecard.yml@8533c21000bd69bcb1c1ab480574e50140b9add8
